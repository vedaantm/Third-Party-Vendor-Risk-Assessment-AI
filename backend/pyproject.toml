[project]
name = "vendoriq-backend"
version = "0.1.0"
description = "VendorIQ API: agentic third-party vendor risk evaluation"
requires-python = ">=3.11.5"
# Direct dependencies, pinned to the versions the test suite passes with.
# uv.lock pins everything else; Dependabot proposes upgrades.
dependencies = [
    "fastapi==0.164.0",
    "uvicorn[standard]==0.54.0",
    "langchain-groq==1.2.0",
    "langchain-core==1.8.3",
    "sqlalchemy[asyncio]==2.1.9",
    "asyncpg==0.32.0",
    "python-dotenv==1.2.4",
    "redis[hiredis]==8.1.0",
    "requests==2.34.2",
    "yfinance==1.8.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "chromadb==1.5.9",
    "pypdf==7.1.1",
    "ddgs==9.16.1",
    "pydantic-settings==2.16.3",
    "alembic==1.20.1",
    "structlog==26.1.0",
]

[dependency-groups]
# Installed by `uv sync` (and `make install`); never in the Docker image.
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",       # FastAPI ASGI test client
    "aiosqlite==0.22.1",   # SQLite stand-in for Supabase in tests
    "fakeredis==2.40.0",   # in-memory Redis for cache tests
    "ruff==0.17.5",        # lint + format (make lint)
    "mypy==2.4.1",         # type check (make lint)
    "types-requests==2.33.0.20261030",
]

[tool.uv]
# An application, not a library: install its dependencies, not the project.
package = false

[tool.mypy]
python_version = "3.11"
files = ["app", "main_api.py"]
# Most third-party libraries here ship no type information
ignore_missing_imports = true
